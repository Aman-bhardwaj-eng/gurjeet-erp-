<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Registration | Gurjeet Electronics ERP</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">

    <style>

        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 420px;
            max-width: 95%;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .register-icon {
            font-size: 45px;
            color: #0d6efd;
        }

        .form-label {
            font-weight: 500;
        }

        .input-group-text {
            background: #f8fafc;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

        .login-link a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="register-card">


    <!-- Header -->

    <div class="text-center mb-4">

        <i class="fa-solid fa-user-plus register-icon"></i>

        <h3 class="mt-3 fw-bold">

            Admin Registration

        </h3>

        <p class="text-muted mb-0">

            Create Gurjeet Electronics ERP Account

        </p>

    </div>



    <!-- Registration Form -->

    <form id="registerForm">


        <!-- Name -->

        <div class="mb-3">

            <label
                for="name"
                class="form-label">

                Full Name

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="fa-solid fa-user"></i>

                </span>


                <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="Enter Full Name"
                    required>

            </div>

        </div>



        <!-- Username -->

        <div class="mb-3">

            <label
                for="username"
                class="form-label">

                Username

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="fa-solid fa-user-tag"></i>

                </span>


                <input
                    type="text"
                    class="form-control"
                    id="username"
                    placeholder="Enter Username"
                    required>

            </div>

        </div>



        <!-- Password -->

        <div class="mb-3">

            <label
                for="password"
                class="form-label">

                Password

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="fa-solid fa-lock"></i>

                </span>


                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Enter Password"
                    minlength="6"
                    required>


                <button
                    class="btn btn-outline-secondary"
                    type="button"
                    id="togglePassword">

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>


            <small class="text-muted">

                Password must be at least 6 characters.

            </small>

        </div>



        <!-- Register Button -->

        <button
            type="submit"
            class="btn btn-primary w-100 mt-2"
            id="registerButton">

            <i class="fa-solid fa-user-plus me-2"></i>

            Register Admin

        </button>


    </form>



    <!-- Message -->

    <div id="message"></div>



    <!-- Login -->

    <div class="login-link">

        Already have an account?

        <a href="/login">

            Login

        </a>

    </div>


</div>



<script>


// ==========================================
// REGISTER
// ==========================================

document
    .getElementById("registerForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        const name =
            document.getElementById("name").value.trim();


        const username =
            document.getElementById("username").value.trim();


        const password =
            document.getElementById("password").value;


        const message =
            document.getElementById("message");


        const registerButton =
            document.getElementById("registerButton");


        // Clear previous message

        message.style.display = "none";


        // Disable button

        registerButton.disabled = true;

        registerButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin me-2"></i> Registering...';



        try {


            const response =
                await fetch("/api/auth/register", {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        name,
                        username,
                        password

                    })

                });



            const result =
                await response.json();



            message.style.display = "block";


            // SUCCESS

            if (response.ok && result.success) {


                message.style.background =
                    "#dcfce7";

                message.style.color =
                    "#166534";


                message.innerHTML =
                    '<i class="fa-solid fa-circle-check me-2"></i>' +
                    result.message;


                document
                    .getElementById("registerForm")
                    .reset();


                // Login page after 1.5 sec

                setTimeout(() => {

                    window.location.href =
                        "/login";

                }, 1500);


            }


            // ERROR

            else {


                message.style.background =
                    "#fee2e2";

                message.style.color =
                    "#991b1b";


                message.innerHTML =
                    '<i class="fa-solid fa-circle-exclamation me-2"></i>' +
                    (result.message ||
                    "Registration Failed");

            }


        }


        catch (error) {


            console.error(error);


            message.style.display =
                "block";


            message.style.background =
                "#fee2e2";

            message.style.color =
                "#991b1b";


            message.innerHTML =
                '<i class="fa-solid fa-triangle-exclamation me-2"></i>' +
                "Server Error. Please try again.";

        }


        finally {


            registerButton.disabled =
                false;


            registerButton.innerHTML =
                '<i class="fa-solid fa-user-plus me-2"></i>' +
                "Register Admin";

        }

    });



// ==========================================
// SHOW / HIDE PASSWORD
// ==========================================

const togglePassword =
    document.getElementById("togglePassword");


const password =
    document.getElementById("password");


togglePassword.addEventListener(
    "click",
    function() {


        if (password.type === "password") {


            password.type =
                "text";


            togglePassword.innerHTML =
                '<i class="fa-solid fa-eye-slash"></i>';

        }


        else {


            password.type =
                "password";


            togglePassword.innerHTML =
                '<i class="fa-solid fa-eye"></i>';

        }

    }
);

</script>


</body>

</html>
