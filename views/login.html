<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Gurjeet Electronics ERP</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">

</head>


<body class="login-page">


<div class="container-fluid vh-100">

    <div class="row h-100">


        <!-- ================= LEFT SIDE ================= -->

        <div class="col-lg-7 d-none d-lg-flex login-left">

            <div class="login-overlay">

                <div class="login-content">

                    <h1>

                        Gurjeet Electronics

                    </h1>


                    <p>

                        Stock ERP Management System

                    </p>

                </div>

            </div>

        </div>



        <!-- ================= RIGHT SIDE ================= -->

        <div
            class="col-lg-5 col-12 d-flex align-items-center justify-content-center">


            <div class="login-card shadow">


                <!-- LOGIN HEADER -->

                <div class="text-center mb-4">


                    <i
                        class="fa-solid fa-mobile-screen-button login-icon">
                    </i>


                    <h3 class="mt-3 fw-bold">

                        Welcome Back

                    </h3>


                    <p class="text-muted">

                        Login to Continue

                    </p>


                </div>



                <!-- LOGIN FORM -->

                <form id="loginForm">


                    <!-- USERNAME -->

                    <div class="mb-3">


                        <label class="form-label">

                            Username

                        </label>


                        <div class="input-group">


                            <span class="input-group-text">

                                <i class="fa-solid fa-user"></i>

                            </span>


                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                placeholder="Enter Username"
                                autocomplete="username"
                                required>


                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="mb-4">


                        <label class="form-label">

                            Password

                        </label>


                        <div class="input-group">


                            <span class="input-group-text">

                                <i class="fa-solid fa-lock"></i>

                            </span>


                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Enter Password"
                                autocomplete="current-password"
                                required>


                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="togglePassword">


                                <i
                                    class="fa-solid fa-eye">
                                </i>


                            </button>


                        </div>

                    </div>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                        id="loginButton">


                        <i
                            class="fa-solid fa-right-to-bracket me-2">
                        </i>


                        Login


                    </button>


                </form>


            </div>

        </div>


    </div>

</div>



<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<script>

    // =====================================================
    // LOGIN
    // =====================================================

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function (e) {

                e.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value
                        .trim();


                const loginButton =
                    document
                        .getElementById("loginButton");


                if (!username || !password) {

                    alert(
                        "Please enter username and password."
                    );

                    return;

                }


                try {


                    loginButton.disabled = true;


                    loginButton.innerHTML = `

                        <span
                            class="spinner-border spinner-border-sm me-2">
                        </span>

                        Logging in...

                    `;


                    const response =
                        await fetch(
                            "/api/auth/login",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        password:
                                            password

                                    })

                            }
                        );


                    const result =
                        await response.json();


                    console.log(
                        "Login Response:",
                        result
                    );


                    // =================================================
                    // LOGIN SUCCESS
                    // =================================================

                    if (
                        response.ok &&
                        result.success &&
                        result.token
                    ) {


                        // Save JWT

                        localStorage.setItem(
                            "token",
                            result.token
                        );


                        // Save User

                        if (result.user) {

                            localStorage.setItem(
                                "user",
                                JSON.stringify(
                                    result.user
                                )
                            );

                        }


                        alert(
                            "Login Successful"
                        );


                        // Dashboard

                        window.location.href =
                            "/dashboard";


                    }

                    else {


                        alert(
                            result.message ||
                            "Invalid Username or Password"
                        );


                    }

                }


                catch (error) {


                    console.error(
                        "Login Error:",
                        error
                    );


                    alert(
                        "Server Error. Please check if the server is running."
                    );


                }


                finally {


                    loginButton.disabled =
                        false;


                    loginButton.innerHTML = `

                        <i
                            class="fa-solid fa-right-to-bracket me-2">
                        </i>

                        Login

                    `;

                }

            }
        );



    // =====================================================
    // SHOW / HIDE PASSWORD
    // =====================================================

    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    const password =
        document.getElementById(
            "password"
        );


    togglePassword.addEventListener(
        "click",
        function () {


            if (
                password.type ===
                "password"
            ) {


                password.type =
                    "text";


                togglePassword.innerHTML =
                    '<i class="fa-solid fa-eye-slash"></i>';

            }


            else {


                password.type =
                    "password";


                togglePassword.innerHTML =
                    '<i class="fa-solid fa-eye"></i>';

            }

        }
    );

</script>


</body>

</html>
